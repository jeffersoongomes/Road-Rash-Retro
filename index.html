<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road Rash Retrô</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #141414;
      color: #ffffff;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    canvas#jogo {
      width: min(92vw, calc(84vh * (4 / 3)));
      height: auto;
      aspect-ratio: 4 / 3;
      border: 3px solid #444444;
      image-rendering: pixelated;
      background: #000000;
    }
  </style>
</head>
<body>
  <h1>Road Rash Retrô</h1>
  <canvas id="jogo" width="800" height="600"></canvas>
  <script src="jogo.js"></script>
</body>
</html>
